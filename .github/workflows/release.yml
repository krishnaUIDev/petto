name: Build & Publish Continuous Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
    paths-ignore:
      - 'apps/web/**'
      - 'README.md'
      - '.github/workflows/deploy-web.yml'
    tags:
      - 'v*'

jobs:
  auto-bump:
    name: Auto Bump Version & Tag
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Auto Bump Version & Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Read version and increment patch number
          NEW_VER=$(node -e "const p=require('./package.json'); const v=(p.version||'0.1.0').split('.').map(Number); v[2]+=1; console.log(v.join('.'))")
          echo "Bumping version to v$NEW_VER"
          
          # Update package files & tauri.conf.json
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version='$NEW_VER'; fs.writeFileSync('./package.json', JSON.stringify(p, null, 2)+'\n')"
          node -e "const fs=require('fs'); const p=require('./apps/desktop/package.json'); p.version='$NEW_VER'; fs.writeFileSync('./apps/desktop/package.json', JSON.stringify(p, null, 2)+'\n')"
          node -e "const fs=require('fs'); const p=require('./apps/desktop/src-tauri/tauri.conf.json'); p.version='$NEW_VER'; fs.writeFileSync('./apps/desktop/src-tauri/tauri.conf.json', JSON.stringify(p, null, 2)+'\n')"
          
          git add package.json apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json
          git commit -m "chore(release): v$NEW_VER"
          git tag "v$NEW_VER"
          git push origin HEAD:main --tags

  publish-tauri:
    name: Build Native Installers (.dmg & .exe)
    needs: auto-bump
    if: always()
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Builds macOS .dmg / .app
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest' # Builds Windows .exe / .msi
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: pnpm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Petto Desktop v__VERSION__'
          releaseBody: 'Automated release build for Petto Desktop Companion.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
